<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEVEL 2 - 플래피 사회 신용</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #fff;
      font-family: "Malgun Gothic", Arial, sans-serif;
      background: radial-gradient(circle at 50% 15%, #2548a8, #050019 70%);
    }
    .wrap {
      width: min(760px, calc(100% - 24px));
      display: grid;
      gap: 12px;
      text-align: center;
    }
    h1 { margin: 0; color: #ffe600; text-shadow: 3px 3px 0 #000; }
    canvas {
      width: 100%;
      aspect-ratio: 3 / 2;
      border: 4px solid #fff;
      background: linear-gradient(#4ed0ff, #dff9ff 66%, #44a845 67%);
      box-shadow: 8px 8px 0 #000;
    }
    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      font-weight: 900;
    }
    button,
    a {
      min-height: 42px;
      padding: 9px 14px;
      border: 3px solid #000;
      color: #000;
      background: #ffe600;
      text-decoration: none;
      font-weight: 900;
      box-shadow: 4px 4px 0 #000;
    }
    a.locked {
      pointer-events: none;
      color: #777;
      background: #d7d7d7;
      box-shadow: none;
    }
  </style>
</head>
<body data-level="level2">
  <main class="wrap">
    <h1>LEVEL 2: 플래피 사회 신용</h1>
    <canvas id="game" width="720" height="480"></canvas>
    <div class="panel">
      <span>점수: <b id="score">0</b></span>
      <span>목표: <b id="target">10</b></span>
      <span>최고: <b id="best">0</b></span>
      <button id="start" type="button">시작 / 재시작</button>
      <a class="locked" id="next" href="level3.html">LEVEL 3 열기</a>
    </div>
  </main>

  <script src="session-tracker.js"></script>
  <script>
    if (!window.AgentSession?.accessDenied) {
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const next = document.getElementById("next");
    const target = 10;
    let bird, pipes, score, frame, running, lastTime, accumulator;
    let best = Number(localStorage.getItem("flappyBest") || 0);
    bestEl.textContent = best;
    window.AgentSession?.setLevelScore("level2", best);

    function reset() {
      bird = { x: 110, y: 220, vy: 0, size: 16 };
      pipes = [];
      score = 0;
      frame = 0;
      running = true;
      lastTime = performance.now();
      accumulator = 0;
      scoreEl.textContent = score;
      draw();
    }

    function flap() {
      if (!running) {
        reset();
        requestAnimationFrame(tick);
      }
      bird.vy = Math.max(bird.vy - 4.2, -5.6);
    }

    function addPipe() {
      const gap = 170;
      const top = 70 + Math.random() * 210;
      pipes.push({ x: canvas.width, top, bottom: top + gap, counted: false });
    }

    function unlockIfNeeded() {
      if (score > best) {
        best = score;
        localStorage.setItem("flappyBest", String(best));
        bestEl.textContent = best;
      }
      if (best >= target) {
        localStorage.setItem("level2Complete", "true");
        next.classList.remove("locked");
        window.AgentSession?.completeLevel("level2", best);
      }
    }

    function drawBird() {
      ctx.fillStyle = "#ffe600";
      ctx.beginPath();
      ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.fillRect(bird.x + 8, bird.y - 7, 5, 5);
      ctx.fillStyle = "#c40000";
      ctx.fillRect(bird.x + 16, bird.y - 1, 14, 6);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#4ed0ff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fff";
      for (let i = 0; i < 5; i += 1) {
        ctx.beginPath();
        ctx.arc(90 + i * 150, 80 + i % 2 * 44, 34, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#34a853";
      ctx.fillRect(0, 425, canvas.width, 55);
      pipes.forEach(pipe => {
        ctx.fillStyle = "#c40000";
        ctx.fillRect(pipe.x, 0, 64, pipe.top);
        ctx.fillRect(pipe.x, pipe.bottom, 64, 425 - pipe.bottom);
        ctx.fillStyle = "#ffe600";
        ctx.fillRect(pipe.x - 5, pipe.top - 14, 74, 14);
        ctx.fillRect(pipe.x - 5, pipe.bottom, 74, 14);
      });
      drawBird();
    }

    function step() {
      if (!running) return;
      frame += 1;
      bird.vy += 0.28;
      bird.vy = Math.min(bird.vy, 6);
      bird.y += bird.vy;
      if (frame % 118 === 1) addPipe();
      pipes.forEach(pipe => {
        pipe.x -= 2.35;
        if (!pipe.counted && pipe.x + 64 < bird.x) {
          pipe.counted = true;
          score += 1;
          scoreEl.textContent = score;
          unlockIfNeeded();
        }
      });
      pipes = pipes.filter(pipe => pipe.x > -80);
      const hit = pipes.some(pipe =>
        bird.x + bird.size > pipe.x &&
        bird.x - bird.size < pipe.x + 64 &&
        (bird.y - bird.size < pipe.top || bird.y + bird.size > pipe.bottom)
      );
      if (hit || bird.y > 425 - bird.size || bird.y < bird.size) {
        running = false;
        unlockIfNeeded();
      }
    }

    function tick(now) {
      if (!running) return;
      const delta = Math.min(50, now - lastTime);
      lastTime = now;
      accumulator += delta;
      while (accumulator >= 16.67) {
        step();
        accumulator -= 16.67;
      }
      draw();
      requestAnimationFrame(tick);
    }

    document.getElementById("start").addEventListener("click", function () {
      reset();
      requestAnimationFrame(tick);
    });
    canvas.addEventListener("click", flap);
    document.addEventListener("keydown", event => {
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
        event.preventDefault();
      }
      if (event.code === "Space") {
        flap();
      }
    });

    if (localStorage.getItem("level2Complete") === "true") next.classList.remove("locked");
    next.addEventListener("click", function () {
      if (!next.classList.contains("locked")) window.AgentSession?.completeLevel("level2", best);
    });
    reset();
    running = false;
    }
  </script>
</body>
</html>
